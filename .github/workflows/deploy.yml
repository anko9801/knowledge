name: Deploy

# ビルドに typst 0.15 が要る。GitHub Pages や Cloudflare のビルド環境には
# 入っていないので、Actions 側で nix develop を通してから静的出力だけを渡す。
# ホストを変えるときは deploy ジョブを差し替えるだけでよい。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中のデプロイは止めず、後から来たものを待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # flake.lock で typst 0.15.1 まで固定してある。
      # nix store をキャッシュして、毎回の取得を省く。
      - name: Cache nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: nix-${{ runner.os }}-

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild が typst-math.css を作り、postbuild が pagefind の索引を作る。
      # どちらも nix develop の中で動かす。
      - name: Build
        run: nix develop --command npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
