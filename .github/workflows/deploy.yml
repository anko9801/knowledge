name: Deploy

# ビルドに typst 0.15 が要る。GitHub Pages や Cloudflare のビルド環境には
# 入っていないので、Actions 側で nix develop を通してから静的出力だけを渡す。
# ホストを変えるときは deploy ジョブを差し替えるだけでよい。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走行中のデプロイは止めず、後から来たものを待たせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # flake.lock で typst 0.15.1 まで固定してある。
      # nix store のキャッシュは専用の action に任せる。actions/cache で
      # /nix/store を直接扱うと、権限の都合で復元が tar のエラーで落ちる。
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # 保存前に掃除する。溜め続けると 10 GB の上限を一つのキャッシュで食い潰す。
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # typst の出力（Content Collection の data-store）を持ち越す。
      # 71 本の組版に 1 分以上かかるので、変わった .typ だけを組み直せば済む。
      # 鍵が外れても restore-keys で古いものを拾えば、差分だけの再組版になる。
      - name: Cache typst output
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: >-
            typst-${{ runner.os }}-${{ hashFiles('flake.lock',
            'src/content/**/*.typ', 'src/typst/**',
            'src/lib/typst-*.ts', 'src/lib/headings.ts') }}
          restore-keys: typst-${{ runner.os }}-

      # 型と単体テスト。壊れたものを公開しないための関所。
      - name: Verify
        run: nix develop --command npm run verify

      # prebuild が typst-math.css を作り、postbuild が pagefind の索引を作る。
      # どちらも nix develop の中で動かす。
      - name: Build
        run: nix develop --command npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
